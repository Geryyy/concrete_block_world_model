world_model_node:
  ros__parameters:
    # ----------------------------------
    # World model (minimal)
    # ----------------------------------
    world_model:
      # Physical block size used for markers, planning objects, and coarse poses.
      block_dimensions_m: [0.9, 0.6, 0.6]
      # Default max distance for matching an incoming observation to a known block.
      association_max_distance_m: 0.45
      # Default max age for a known block to be considered for association.
      association_max_age_s: 20.0
      # Ignore updates below this confidence unless explicitly targeted.
      min_update_confidence: 0.25
      # How long an unchanged /crane/collision_scene may go unrepublished, s. The scene is
      # published on change; without this it would be published on change *only*, and the topic is
      # transient-local, so the planner -- which ages it against its own max_scene_age (10 s) --
      # could not tell a latched scene from a world model that had died. Republishing the same
      # scene every 2 s makes an unchanged world keep saying so. It rides
      # marker_refresh_period_s, so it is only honoured to that resolution.
      collision_scene_heartbeat_s: 2.0
      # Fixed obstacles published with the world markers and planning scene.
      static_scene_objects: |
        # Converted out of the legacy K0_mounting_base boxes of
        # epsilon_crane_bringup_mp/config/motion_planning/collision_objects.yaml,
        # which collision_body_handler published in K0_mounting_base, not world:
        #   world = (-6.939 - k0_x, 0.350 - k0_y, 1.141 + k0_z) at the recorded truck pose.
        # Re-measure them for a real site -- these are the old site's geometry.
        - id: container
          position: [-9.439, -10.650, 2.461]
          dimensions: [7.0, 4.0, 5.0]
        - id: hedge
          position: [-6.939, 6.850, 1.461]
          dimensions: [20.0, 5.0, 3.0]
        # - id: post_right_1
        #   frame_id: world
        #   position: [-5.558000, 1.652500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # - id: post_right_2
        #   frame_id: world
        #   position: [-2.574000, 1.652500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # - id: post_right_3
        #   frame_id: world
        #   position: [-1.361500, 1.652500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # - id: post_left_1
        #   frame_id: world
        #   position: [-5.558000, -0.952500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # - id: post_left_2
        #   frame_id: world
        #   position: [-2.574000, -0.952500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # - id: post_left_3
        #   frame_id: world
        #   position: [-1.361500, -0.952500, 1.097000]
        #   dimensions: [0.140000, 0.152500, 1.060000]
        # The truck is NOT a static scene object -- see world_model.vehicle_box below. It used to
        # be three of them (truck_main / truck_rear / truck_bed) and they carried no notion of a
        # vehicle pose; the planner needs the vehicle as one primitive it can expand.
        # - id: slewing_column
        #   frame_id: world
        #   position: [0.000000, 0.000000, 1.212500]
        #   dimensions: [0.450000, 0.650000, 1.512500]

      # ---- The vehicle the crane is bolted to ----
      # Emitted into the collision scene as the single primitive with the id
      # `truck`, which crane_msgs reserves (ros2_interfaces 6). The planner
      # expands it into a bed slab at the box's top face, the six runges of
      # trajectory_planning 4.2 standing on that face and the headboard closing
      # its cab end, every piece structural.
      #
      # So this box is the LOAD AREA, whose top face is the bed surface -- not
      # the whole vehicle silhouette. The crane is bolted to the front of the
      # vehicle, so checking its mounting base against a box that reached the
      # ground would report the crane colliding with the truck it is part of.
      # Only the slab above the top face becomes an obstacle.
      #
      # The pose is a static configured value, not a measurement. That is the
      # accepted interim: it is the seam a vehicle-pose estimator later replaces,
      # with no planner change, because the planner keys every expanded piece to
      # whatever pose the primitive carries.
      vehicle_box:
        enable: true
        frame_id: world
        # MEASURED OFF THE DESCRIPTION, in `world`. The values this entry was
        # first written with came from `collision_bodies_truck_matlab.urdf.xacro`,
        # which parents every box to `K0_mounting_base` -- and `mounting_on_truck`
        # puts K0 at world (-6.9385, +0.350, 1.1407) yawed by pi. Copying those
        # numbers into a `world` entry carried the +0.350 mounting offset into the
        # bed and both runge rows, so the modelled left runge sat 0.37 m inboard of
        # the real one and the real one was outside its own obstacle. The numbers
        # below come from `timber_loader_AIT.urdf.xacro` expanded and read in
        # `world`, so the frame is the one the field says it is:
        #   x  the loading deck runs -6.470 .. -0.555. The front face is pulled
        #      back to -6.109 because the crane's own K0 body -- the fitted box in
        #      crane_model/config/collision_model.yaml, looser than the mesh --
        #      reaches back to -6.254, and a bed slab inside K0 refuses every goal.
        #      -> 5.554 long, centred at -3.332, clearing K0 by 0.145 m.
        #   y  the deck is 2.510 wide, centred on the vehicle (NOT on the crane).
        #      2.518 because this box is axis-aligned while the bed carries a
        #      0.09 deg roll, which throws a runge's outer corner out to 1.259.
        #   z  the deck surface is at 1.264. Thickness is free -- only the top
        #      face is used -- so the legacy 0.662850 is kept: centre 0.932575.
        position: [-3.332000, 0.000000, 0.932575]
        rpy_deg: [0.0, 0.0, 0.0]
        # Full extents per axis, never half-extents: x along the bed, z up.
        dimensions: [5.554000, 2.518000, 0.662850]
        # Check only, no geometry is emitted from these two. crane_planning owns
        # the runge model (`truck.runge_dimensions`, `truck.runge_stations`) and
        # refuses a scene whose bed is too short to carry a station. These mirror
        # its defaults so the mismatch is reported here, where the box is
        # configured, instead of arriving as a refused scene. Keep them equal to
        # the planner's, or set runge_stations_m to [] to turn the check off.
        #
        # Stations are offsets from the box centre, and they put the runges at
        # world x -5.593, -4.381 and -1.397 -- where `lkw_rungen_134.stl` stands
        # the posts. The world model cannot see the `post_setup` the description
        # was expanded with, so this is the union of the two that ship:
        # `post_setup:=134` (crane_bringup/launch/sim.launch.py) and `13`
        # (concrete_block_behavior_tree, hardware), whose posts are a subset.
        # `post_setup:=124` adds a fourth at world -2.950 and nothing launches it;
        # add the station 0.382 here if that ever changes. The previous
        # [-2.0, 0.0, 2.0] matched no post position at all.
        runge_length_m: 0.28
        runge_stations_m: [-2.261, -1.049, 1.935]

    # ----------------------------------
    # Grasped / lifted block tracking -- and the FK state refine_grasped below shares
    # ----------------------------------
    task_move:
      # Once a block is marked TASK_MOVE, its world pose is owned by FK:
      # T_world_block = T_world_tcp * refine_grasped.tcp_to_block.
      fk_tracking:
        # Update TASK_MOVE blocks from TCP FK between vision refinements.
        enabled: true

    # REFINE_GRASPED runs on the point-cloud detector: it sends the FK pose below as its
    # prior and folds the matching detection back into the grasp offset. The RGB stage that
    # used to own the rest of this block (ROI, segmentation, pose fusion) is gone.
    refine_grasped:
      # TCP frame the grasped block's pose is predicted from -- both for FK tracking of a
      # TASK_MOVE block and for the prior REFINE_GRASPED sends.
      tcp_frame: "elastic/K8_tool_center_point"
      # Read for its projection matrix P by the scene-discovery pose overlay, which draws
      # block wireframes onto the rectified Blackfly image. Nothing else uses it.
      camera_info_topic: "/blackfly_rotated/camera_info"
      # Units: xyz in meters, rpy in radians, expressed in tcp_frame axes.
      # Nominal TCP->block offset. On TASK_MOVE the real offset is auto-captured from the
      # block's registered pose and the current TCP (T_world_tcp^-1 * T_world_block); this
      # nominal is only the fallback when no registered pose exists, and (when non-identity)
      # a plausibility bound on the auto-capture.
      tcp_to_block:
        # Translation from TCP to block center.
        xyz: [0.0, 0.0, 0.9]
        # Rotation from TCP to block frame as roll, pitch, yaw.
        rpy: [0.0, 0.0, 0.0]
      grasp_offset_capture:
        # Reject an auto-captured offset whose translation deviates from the nominal
        # tcp_to_block by more than this (m). Only enforced when tcp_to_block is non-identity.
        max_deviation_m: 1.0

    # REFINE_BLOCK re-measures the target with the point-cloud detector, sending the
    # target's world pose as the single prior and accepting the nearest detection inside
    # that prior's tolerances. Those tolerances are the *top-level* scene_discovery.priors.*
    # parameters -- NOT world_model.scene_discovery.*, which is a different prefix carrying the
    # association gates -- declared with defaults in perception_orchestrator_node.cpp and
    # deliberately not overridden here -- widening translation_tolerance_m past half the
    # block pitch would let a refine write a neighbour's pose into the target.
